{% extends "base.html" %}
{% block content %}
<div class="p-10 max-w-4xl mx-auto">
    <h2 class="text-3xl font-black text-gray-900 mb-8">Реквизиты компании</h2>
    <div class="bg-white p-10 rounded-3xl shadow-sm border border-gray-100">
        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-2 gap-6">
                <div><label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Бенефициар (Наименование)</label><input type="text" name="company_name" value="{{ s.company_name }}" class="w-full bg-gray-50 p-3 rounded-xl font-bold"></div>
                <div><label class="block text-[10px] font-black text-gray-400 uppercase mb-1">БИН / ИИН</label><input type="text" name="company_bin" value="{{ s.company_bin }}" class="w-full bg-gray-50 p-3 rounded-xl font-bold"></div>
            </div>
            <div class="grid grid-cols-2 gap-6">
                <div><label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Банк бенефициар</label><input type="text" name="company_bank" value="{{ s.company_bank }}" class="w-full bg-gray-50 p-3 rounded-xl font-bold"></div>
                <div><label class="block text-[10px] font-black text-gray-400 uppercase mb-1">БИК</label><input type="text" name="company_bik" value="{{ s.company_bik }}" class="w-full bg-gray-50 p-3 rounded-xl font-bold font-mono"></div>
            </div>
            <div><label class="block text-[10px] font-black text-gray-400 uppercase mb-1">ИИК (IBAN)</label><input type="text" name="company_iban" value="{{ s.company_iban }}" class="w-full bg-gray-50 p-3 rounded-xl font-bold font-mono text-lg tracking-wider"></div>
            <div class="grid grid-cols-2 gap-6">
                <div><label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Кбе</label><input type="text" name="company_kbe" value="{{ s.company_kbe }}" class="w-full bg-gray-50 p-3 rounded-xl font-bold"></div>
                <div><p class="text-xs text-gray-400 mt-6">КНП выбирается отдельно при создании каждого счета из Справочника КНП.</p></div>
            </div>
            <div><label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Юридический адрес</label><input type="text" name="company_address" value="{{ s.company_address }}" class="w-full bg-gray-50 p-3 rounded-xl font-bold"></div>
            <div class="pt-6"><button type="submit" class="bg-black text-white px-10 py-4 rounded-xl font-bold shadow-xl hover:bg-gray-800 transition">Сохранить реквизиты</button></div>
        </form>
    </div>
</div>
{% endblock %}
