<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Чингисхан | PRO v3.1</title>
    <script src="{{ url_for('static', filename='css/tailwind.js') }}"></script>
    <link href="{{ url_for('static', filename='css/all.min.css') }}" rel="stylesheet">
    
    <style>
        /* Подключаем наш локальный JetBrains Mono */
        @import url('{{ url_for("static", filename="fonts/jetbrains-mono.css") }}');
        
        /* Убрали несуществующий inter.css, используем красивые системные шрифты */
        body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        
        /* Принудительно применяем JetBrains Mono к классу font-mono */
        .font-mono { font-family: 'JetBrains Mono', monospace !important; }
        
        /* Прячем скроллбар, но оставляем прокрутку */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#f4f7f6] flex h-screen font-sans text-gray-800">
    
    <!-- Светлое боковое меню -->
    <aside class="w-64 bg-white border-r border-gray-100 flex flex-col shadow-sm z-50">
        <!-- Логотип -->
        <div class="h-20 flex items-center px-6 border-b border-gray-50">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-black text-lg mr-3 shadow-md shadow-blue-200">
                <i class="fas fa-layer-group"></i>
            </div>
            <div>
                <h1 class="text-[20px] font-black tracking-tight text-gray-900 leading-none uppercase">Чингизхан</h1>
                <p class="text-[10px] font-bold text-gray-400 mt-0.5 tracking-widest uppercase">PRO v3.1</p>
            </div>
        </div>

        <!-- Навигация -->
        <nav class="flex-1 px-4 py-6 space-y-6 overflow-y-auto scrollbar-hide" id="mainNav">
            <!-- ГЛАВНАЯ -->
            <div>
                <p class="text-[9px] font-bold text-gray-400 mb-2 px-3 tracking-widest uppercase">Главная</p>
                <div class="space-y-1">
                    <a href="/" class="nav-link flex items-center px-3 py-2 rounded-xl text-gray-600 hover:bg-gray-50 transition font-medium text-sm"><i class="fas fa-chart-line w-5 text-center mr-2 text-gray-400 icon"></i> Дашборд</a>
                </div>
            </div>
            
            <!-- ПРОДАЖИ -->
            <div>
                <p class="text-[9px] font-bold text-gray-400 mb-2 px-3 tracking-widest uppercase">Продажи</p>
                <div class="space-y-1">
                    <a href="/proposals" class="nav-link flex items-center px-3 py-2 rounded-xl text-gray-600 hover:bg-gray-50 transition font-medium text-sm"><i class="fas fa-file-invoice w-5 text-center mr-2 text-gray-400 icon"></i> Коммерческие КП</a>
                    <a href="/invoices" class="nav-link flex items-center px-3 py-2 rounded-xl text-gray-600 hover:bg-gray-50 transition font-medium text-sm"><i class="fas fa-receipt w-5 text-center mr-2 text-gray-400 icon"></i> Счета</a>
                </div>
            </div>

<!-- СПРАВОЧНИКИ -->
            <div>
                <p class="text-[9px] font-bold text-gray-400 mb-2 px-3 tracking-widest uppercase">Справочники</p>
                <div class="space-y-1">
                    <a href="/clients" class="nav-link flex items-center px-3 py-2 rounded-xl text-gray-600 hover:bg-gray-50 transition font-medium text-sm"><i class="fas fa-users w-5 text-center mr-2 text-gray-400 icon"></i> Клиенты</a>
                    
                    <!-- ШАГ 3 ВСТАВЛЕН СЮДА: -->
                    <a href="/suppliers" class="nav-link flex items-center px-3 py-2 rounded-xl text-gray-600 hover:bg-gray-50 transition font-medium text-sm"><i class="fas fa-truck-loading w-5 text-center mr-2 text-gray-400 icon"></i> Поставщики</a>
                    <!-- ===================== -->
<a href="/materials" class="nav-link flex items-center px-3 py-2 rounded-xl text-gray-600 hover:bg-gray-50 transition font-medium text-sm"><i class="fas fa-boxes w-5 text-center mr-2 text-gray-400 icon"></i> Склад сырья</a>
                    <a href="/catalog" class="nav-link flex items-center px-3 py-2 rounded-xl text-gray-600 hover:bg-gray-50 transition font-medium text-sm"><i class="fas fa-cubes w-5 text-center mr-2 text-gray-400 icon"></i> Каталог</a>
                    <a href="/categories" class="nav-link flex items-center px-3 py-2 rounded-xl text-gray-600 hover:bg-gray-50 transition font-medium text-sm"><i class="fas fa-tags w-5 text-center mr-2 text-gray-400 icon"></i> Категории</a>
                    <a href="/knp" class="nav-link flex items-center px-3 py-2 rounded-xl text-gray-600 hover:bg-gray-50 transition font-medium text-sm"><i class="fas fa-code w-5 text-center mr-2 text-gray-400 icon"></i> КНП</a>
                </div>
            </div>

            <!-- АНАЛИТИКА -->
            <div>
                <p class="text-[9px] font-bold text-gray-400 mb-2 px-3 tracking-widest uppercase">Аналитика</p>
                <div class="space-y-1">
                    <a href="/issued_invoices" class="nav-link flex items-center px-3 py-2 rounded-xl text-gray-600 hover:bg-gray-50 transition font-medium text-sm"><i class="fas fa-chart-pie w-5 text-center mr-2 text-gray-400 icon"></i> По клиентам</a>
                    <a href="/settings" class="nav-link flex items-center px-3 py-2 rounded-xl text-gray-600 hover:bg-gray-50 transition font-medium text-sm"><i class="fas fa-cog w-5 text-center mr-2 text-gray-400 icon"></i> Настройки</a>
                </div>
            </div>
        </nav>
    </aside>

    <!-- Основной контент -->
    <main class="flex-1 overflow-y-auto">
        {% block content %}{% endblock %}
    </main>

    <script>
        // Скрипт для автоматической подсветки активного пункта меню
        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link');
            
            navLinks.forEach(link => {
                const linkPath = link.getAttribute('href');
                if (currentPath === linkPath || (linkPath !== '/' && currentPath.startsWith(linkPath))) {
                    // Активируем ссылку (синий фон, синий текст)
                    link.className = 'nav-link flex items-center px-3 py-2 rounded-xl bg-blue-50 text-blue-600 transition font-bold text-sm';
                    const icon = link.querySelector('.icon');
                    if (icon) {
                        icon.classList.remove('text-gray-400');
                        icon.classList.add('text-blue-600');
                    }
                }
            });
        });
    </script>
</body>
</html>
