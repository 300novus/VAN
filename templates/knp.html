{% extends "base.html" %}
{% block content %}
<div class="p-10 max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-black text-gray-900">Справочник КНП</h2>
        <button onclick="openModal('addModal')" class="bg-black text-white px-6 py-2.5 rounded-xl font-bold hover:bg-gray-800 transition"><i class="fas fa-plus mr-2"></i> Добавить КНП</button>
    </div>
    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-left">
            <thead>
                <tr class="bg-gray-50 border-b border-gray-100 font-bold text-gray-500 text-[10px] uppercase tracking-widest">
                    <th class="py-4 px-6 w-32">Код КНП</th><th class="py-4 px-6">Наименование / Назначение</th><th class="py-4 px-6 text-right">Действия</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-50 text-sm">
                {% for k in knp_list %}
                <tr>
                    <td class="py-4 px-6 font-black text-lg">{{ k[0] }}</td><td class="py-4 px-6 text-gray-600 font-medium">{{ k[1] }}</td>
                    <td class="py-4 px-6 text-right space-x-2">
                        <button onclick="openEditModal('{{ k[0] }}', '{{ k[1] }}')" class="text-blue-500 hover:text-blue-700 bg-blue-50 px-3 py-1.5 rounded-lg font-bold"><i class="fas fa-pen"></i> Изм.</button>
                        <button onclick="deleteKNP('{{ k[0] }}')" class="text-red-500 hover:text-red-700 bg-red-50 px-3 py-1.5 rounded-lg"><i class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<div id="addModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center backdrop-blur-sm z-50">
    <div class="bg-white p-8 rounded-3xl w-[500px] shadow-2xl">
        <h3 class="text-xl font-black mb-6">Новый КНП</h3>
        <form id="addForm" class="space-y-4">
            <div><label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Код КНП</label><input id="k_code" required class="w-full bg-gray-50 p-3 rounded-xl border border-transparent outline-none"></div>
            <div><label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Назначение</label><input id="k_name" required class="w-full bg-gray-50 p-3 rounded-xl border border-transparent outline-none"></div>
            <div class="pt-4 flex gap-3"><button type="button" onclick="closeModal('addModal')" class="flex-1 bg-gray-100 font-bold py-3 rounded-xl">Отмена</button><button type="submit" class="flex-1 bg-black text-white font-bold py-3 rounded-xl">Сохранить</button></div>
        </form>
    </div>
</div>

<div id="editModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center backdrop-blur-sm z-50">
    <div class="bg-white p-8 rounded-3xl w-[500px] shadow-2xl">
        <h3 class="text-xl font-black mb-6">Изменить КНП</h3>
        <form id="editForm" class="space-y-4">
            <input type="hidden" id="e_old_code">
            <div><label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Код КНП</label><input id="e_code" required class="w-full bg-gray-50 p-3 rounded-xl border border-transparent outline-none"></div>
            <div><label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Назначение</label><input id="e_name" required class="w-full bg-gray-50 p-3 rounded-xl border border-transparent outline-none"></div>
            <div class="pt-4 flex gap-3"><button type="button" onclick="closeModal('editModal')" class="flex-1 bg-gray-100 font-bold py-3 rounded-xl">Отмена</button><button type="submit" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl">Обновить</button></div>
        </form>
    </div>
</div>

<script>
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
    function openEditModal(code, name) { document.getElementById('e_old_code').value = code; document.getElementById('e_code').value = code; document.getElementById('e_name').value = name; openModal('editModal'); }
    function deleteKNP(code) { if(confirm('Удалить этот КНП?')) { fetch(`/api/delete_knp/${code}`, { method: 'POST' }).then(() => window.location.reload()); } }
    
    document.getElementById('addForm').onsubmit = (e) => { e.preventDefault(); fetch('/api/add_knp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ code: document.getElementById('k_code').value, name: document.getElementById('k_name').value }) }).then(() => window.location.reload()); }
    document.getElementById('editForm').onsubmit = (e) => { e.preventDefault(); fetch('/api/edit_knp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ old_code: document.getElementById('e_old_code').value, new_code: document.getElementById('e_code').value, name: document.getElementById('e_name').value }) }).then(() => window.location.reload()); }
</script>
{% endblock %}
