{% extends "base.html" %}

{% block content %}
<div class="p-10 max-w-7xl mx-auto">
    <!-- Заголовок страницы -->
    <div class="flex justify-between items-center mb-8">
        <div>
            <h2 class="text-3xl font-black text-gray-900 tracking-tight">Справочник КНП</h2>
            <p class="text-gray-500 text-sm mt-1">Коды назначения платежей</p>
        </div>
        <button onclick="openModal('addModal')" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-blue-700 transition shadow-md shadow-blue-200"><i class="fas fa-plus mr-2"></i> Добавить КНП</button>
    </div>
    
    <!-- Таблица КНП -->
    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-left">
            <thead>
                <tr class="bg-gray-50/50 border-b border-gray-100">
                    <th class="py-4 px-6 w-32 text-[10px] font-black text-gray-400 uppercase tracking-widest">Код КНП</th>
                    <th class="py-4 px-6 text-[10px] font-black text-gray-400 uppercase tracking-widest">Наименование / Назначение</th>
                    <th class="py-4 px-6 text-right text-[10px] font-black text-gray-400 uppercase tracking-widest">Действия</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-50 text-sm">
                {% for k in knp_list %}
                <tr class="hover:bg-gray-50 transition group">
                    <td class="py-4 px-6 font-bold text-lg text-blue-600 font-mono">{{ k[0] }}</td>
                    <td class="py-4 px-6 text-gray-900 font-medium">{{ k[1] }}</td>
                    <td class="py-4 px-6 text-right space-x-2 opacity-0 group-hover:opacity-100 transition">
                        <button onclick="openEditModal('{{ k[0] }}', '{{ k[1] }}')" class="text-blue-500 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg font-bold transition" title="Изменить"><i class="fas fa-pen"></i></button>
                        <button onclick="deleteKNP('{{ k[0] }}')" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition" title="Удалить"><i class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- Модальное окно: Добавить -->
<div id="addModal" class="fixed inset-0 bg-gray-900/50 hidden items-center justify-center backdrop-blur-sm z-50 transition-opacity">
    <div class="bg-white p-8 rounded-3xl w-[500px] shadow-2xl border border-gray-100">
        <h3 class="text-xl font-black mb-6 text-gray-900">Новый КНП</h3>
        <form id="addForm" class="space-y-4">
            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Код КНП</label>
                <input id="k_code" required class="w-full bg-gray-50 p-3 rounded-xl border border-gray-200 outline-none focus:border-blue-500 focus:bg-white transition font-mono font-bold">
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Назначение</label>
                <input id="k_name" required class="w-full bg-gray-50 p-3 rounded-xl border border-gray-200 outline-none focus:border-blue-500 focus:bg-white transition font-medium">
            </div>
            <div class="pt-4 flex gap-3">
                <button type="button" onclick="closeModal('addModal')" class="flex-1 bg-gray-100 text-gray-600 hover:bg-gray-200 font-bold py-3 rounded-xl transition">Отмена</button>
                <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md shadow-blue-200 transition">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<!-- Модальное окно: Изменить -->
<div id="editModal" class="fixed inset-0 bg-gray-900/50 hidden items-center justify-center backdrop-blur-sm z-50 transition-opacity">
    <div class="bg-white p-8 rounded-3xl w-[500px] shadow-2xl border border-gray-100">
        <h3 class="text-xl font-black mb-6 text-gray-900">Изменить КНП</h3>
        <form id="editForm" class="space-y-4">
            <input type="hidden" id="e_old_code">
            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Код КНП</label>
                <input id="e_code" required class="w-full bg-gray-50 p-3 rounded-xl border border-gray-200 outline-none focus:border-blue-500 focus:bg-white transition font-mono font-bold">
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">Назначение</label>
                <input id="e_name" required class="w-full bg-gray-50 p-3 rounded-xl border border-gray-200 outline-none focus:border-blue-500 focus:bg-white transition font-medium">
            </div>
            <div class="pt-4 flex gap-3">
                <button type="button" onclick="closeModal('editModal')" class="flex-1 bg-gray-100 text-gray-600 hover:bg-gray-200 font-bold py-3 rounded-xl transition">Отмена</button>
                <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md shadow-blue-200 transition">Обновить</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
    function openEditModal(code, name) { document.getElementById('e_old_code').value = code; document.getElementById('e_code').value = code; document.getElementById('e_name').value = name; openModal('editModal'); }
    function deleteKNP(code) { if(confirm('Удалить этот КНП?')) { fetch(`/api/delete_knp/${code}`, { method: 'POST' }).then(() => window.location.reload()); } }
    
    document.getElementById('addForm').onsubmit = (e) => { e.preventDefault(); fetch('/api/add_knp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ code: document.getElementById('k_code').value, name: document.getElementById('k_name').value }) }).then(() => window.location.reload()); }
    document.getElementById('editForm').onsubmit = (e) => { e.preventDefault(); fetch('/api/edit_knp', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ old_code: document.getElementById('e_old_code').value, new_code: document.getElementById('e_code').value, name: document.getElementById('e_name').value }) }).then(() => window.location.reload()); }
</script>
{% endblock %}
